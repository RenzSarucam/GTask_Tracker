services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: gaisano-task-tracker-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - app_code:/var/www/html
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        networks:
            - gaisano

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - app_code:/var/www/html:ro
        depends_on:
            - app
        networks:
            - gaisano

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-gaisano_task_tracker}
            MYSQL_USER: ${DB_USERNAME:-gaisano}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - gaisano

networks:
    gaisano:
        driver: bridge

volumes:
    db_data:
    app_code:
